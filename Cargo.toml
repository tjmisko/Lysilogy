[package]
name = "lysilogy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first atlas and contextual reader for scientific papers"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
regex = "1.12.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dependencies]
axum = { version = "0.8.4", features = ["json", "macros"] }
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.45", features = ["derive", "env"] }
lysilogy-core = { path = "crates/lysilogy-core" }
lysilogy-db = { path = "crates/lysilogy-db" }
lysilogy-ingest = { path = "crates/lysilogy-ingest" }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.12.0"
uuid = { workspace = true }
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.3"
sqlx = { workspace = true }
tempfile = "3.21.0"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
